<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Equipe · Pedidos</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: "Segoe UI", sans-serif;
    }
  </style>
  <meta name="csrf-token" content="{{ csrf_token() }}">
</head>

<body class="min-h-screen bg-stone-100 text-stone-900">
  <header class="bg-stone-950 text-white">
    <div class="mx-auto flex max-w-7xl items-center justify-between gap-4 px-5 py-4">
      <a href="{{ url_for('pedidos_tv.index') }}" class="text-lg font-bold">Açougue · Pedidos</a>
      <nav class="flex items-center gap-5 text-sm">
        <a href="{{ url_for('pedidos_tv.index') }}" class="text-stone-300 hover:text-white">Painel</a>
        <a href="{{ url_for('pedidos_tv.cadastro') }}" class="text-stone-300 hover:text-white">Equipe</a>
        <a href="{{ url_for('pedidos_tv.relatorios') }}" class="text-stone-300 hover:text-white">Relatórios</a>
        <a href="{{ url_for('pedidos_tv.tv') }}" target="_blank" class="text-stone-300 hover:text-white">TV</a>
      </nav>
    </div>
  </header>
  <main class="mx-auto max-w-5xl px-5 py-8">
    <section class="max-w-xl border-t-4 border-emerald-700 bg-white p-6 shadow-sm">
      <p class="text-xs font-bold uppercase tracking-widest text-emerald-800">Equipe</p>
      <h1 class="mt-1 text-2xl font-bold">Açougueiros</h1>
      <form id="butcher-form" data-kind="açougueiro" class="mt-5 flex flex-col gap-3 sm:flex-row">
        <input name="nome" required maxlength="100" placeholder="Nome do açougueiro"
          class="min-w-0 flex-1 rounded border border-stone-300 px-3 py-2">
        <button
          class="rounded bg-emerald-800 px-4 py-2 font-semibold text-white hover:bg-emerald-900">Adicionar</button>
      </form>
      <p id="form-message" role="status" class="mt-3 min-h-5 text-sm"></p>
    </section>
    <section class="mt-10 max-w-3xl">
      <h2 class="border-b border-stone-300 pb-3 text-lg font-bold">Açougueiros cadastrados</h2>
      <div id="butchers" class="divide-y divide-stone-200 bg-white"></div>
    </section>
    <section class="mt-10 max-w-xl border-t-4 border-sky-700 bg-white p-6 shadow-sm">
      <p class="text-xs font-bold uppercase tracking-widest text-sky-800">Equipe</p>
      <h2 class="mt-1 text-xl font-bold">Atendentes</h2>
      <form id="attendant-form" data-kind="atendente" class="mt-5 flex flex-col gap-3 sm:flex-row">
        <input name="nome" required maxlength="100" placeholder="Nome da atendente"
          class="min-w-0 flex-1 rounded border border-stone-300 px-3 py-2">
        <button class="rounded bg-sky-800 px-4 py-2 font-semibold text-white hover:bg-sky-900">Adicionar</button>
      </form>
      <p id="attendant-message" role="status" class="mt-3 min-h-5 text-sm"></p>
      <div id="attendants" class="mt-3 divide-y divide-stone-200"></div>
    </section>
    <section class="mt-10 max-w-xl border-t-4 border-stone-700 bg-white p-6 shadow-sm">
      <p class="text-xs font-bold uppercase tracking-widest text-stone-800">Segurança</p>
      <h2 class="mt-1 text-xl font-bold">Senha de Exclusão de Pedidos</h2>
      <p class="mb-4 text-sm text-stone-600">A senha padrão inicial é <strong>0000</strong>.</p>
      <form id="config-form" class="mt-5 flex flex-col gap-3 sm:flex-row">
        <input name="senha_atual" type="password" required placeholder="Senha atual"
          class="min-w-0 flex-1 rounded border border-stone-300 px-3 py-2">
        <input name="nova_senha" type="password" required placeholder="Nova senha"
          class="min-w-0 flex-1 rounded border border-stone-300 px-3 py-2">
        <button class="rounded bg-stone-800 px-4 py-2 font-semibold text-white hover:bg-stone-900">Salvar</button>
      </form>
      <p id="config-message" role="status" class="mt-3 min-h-5 text-sm"></p>
    </section>
  </main>
  <script src="{{ url_for('static', filename='pedidos_tv/cadastro.js') }}" defer></script>
</body>

</html>
