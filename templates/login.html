{% extends "base.html" %}
{% block title %}Entrar | GabeSH.dev{% endblock %}
{% block content %}
<section class="flex min-h-[72vh] items-center justify-center px-5 py-12">
  <div class="w-full max-w-md rounded-2xl border border-line bg-panel p-6 sm:p-8">
    <a href="{{ url_for('index') }}" class="text-sm font-medium text-blue-500 hover:underline">← Voltar ao site</a>
    <p class="mt-8 text-sm font-semibold text-blue-500">Área do cliente</p>
    <h1 class="mt-2 text-3xl font-bold">Acesse sua conta.</h1>
    <p class="mt-3 text-sm leading-6 text-slate-400">Acompanhe seu projeto e acesse os sistemas contratados.</p>
    <form method="post" class="mt-7 space-y-4">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label class="block text-sm font-medium text-slate-300">E-mail<input required type="email" name="email"
          autocomplete="username" maxlength="254"
          class="mt-2 w-full rounded-lg border border-line bg-ink px-3.5 py-3 text-white outline-none focus:border-blue-500"
          placeholder="voce@empresa.com"></label>
      <label class="block text-sm font-medium text-slate-300">Senha
        <div class="relative mt-2">
          <input required type="password" name="senha" autocomplete="current-password"
            class="w-full rounded-lg border border-line bg-ink py-3 pl-3.5 pr-12 text-white outline-none focus:border-blue-500"
            placeholder="Sua senha">
          <button type="button"
            class="toggle-password absolute inset-y-0 right-0 flex items-center px-3 text-slate-400 hover:text-white"
            tabindex="-1">
            <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            </svg>
          </button>
        </div>
      </label>
      <button type="submit"
        class="w-full rounded-lg bg-blue-600 px-5 py-3 font-semibold text-white transition hover:bg-blue-500">Entrar</button>
    </form>
    <p class="mt-6 text-center text-xs text-slate-500">Precisa de acesso? Entre em contato com a equipe GabeSH.dev.</p>
  </div>
</section>
{% endblock %}
